<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スキる</title>
<meta name="theme-color" content="#d9642a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキる">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-96.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DotGothic16&family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one phone-width column, dragon "nest" on top, cards below, tab bar fixed at the bottom */
:root {
  --bg: #e9f1ee;
  --panel: #ffffff;
  --fg: #1d2a28;
  --muted: #5d6f6b;
  --line: #d3e0dc;
  --accent: #d9642a;
  --accent-soft: #fbe6da;
  --good: #2f8a57;
  --warn: #b7791f;
  --bad: #c2413b;
  --nest: #d8e8e2;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "DotGothic16", "Zen Maru Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a1a; --panel: #1a2626; --fg: #e6efec; --muted: #9db0ab; --line: #2c3d3b;
    --accent: #f08a50; --accent-soft: #3a2a20; --good: #5cc28a; --warn: #e0a84a; --bad: #ec6f68; --nest: #18302c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a1a; --panel: #1a2626; --fg: #e6efec; --muted: #9db0ab; --line: #2c3d3b;
  --accent: #f08a50; --accent-soft: #3a2a20; --good: #5cc28a; --warn: #e0a84a; --bad: #ec6f68; --nest: #18302c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 500; font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 440px; margin: 0 auto; padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { font-weight: 900; font-size: 26px; letter-spacing: .04em; }
.logo span { color: var(--accent); }
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.logo { white-space: nowrap; }
.app-icon { width: 40px; height: 40px; border-radius: 12px; display: block; box-shadow: 0 0 0 1px var(--line); }
.hero-icon { width: 180px; max-width: 100%; height: auto; border-radius: 32px; display: block; margin: 0 auto; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; text-align: right; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.badge { font-size: 11px; letter-spacing: .08em; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 8px; font-weight: 700; }

.nest { background: var(--nest); border-radius: 28px; padding: 14px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; overflow: hidden; }
.nest svg.dragon { width: 210px; max-width: 100%; height: auto; display: block; }
.dragon-body { animation: bob 3.2s ease-in-out infinite; transform-origin: 100px 180px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.grow-fx { animation: grow .9s ease-out; }
@keyframes grow { 0% { transform: scale(.6); opacity: .4; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dragon-body, .grow-fx { animation: none; } }
.stage-name { font-weight: 900; font-size: 20px; }
.stages { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.stages i { width: 26px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.stages i.on { background: var(--dc, var(--accent)); }
.streak { font-size: 13px; color: var(--muted); }
.streak b { font-family: var(--font-num); font-weight: 400; color: var(--fg); font-size: 16px; }

.card { background: var(--panel); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.card h2 { margin: 0; font-size: 16px; font-weight: 900; text-wrap: balance; }
.card .sub { margin: 0; font-size: 13px; color: var(--muted); }

.counter { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
.ring { width: 200px; height: 200px; position: relative; border-radius: 50%; }
.ring::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--panel), var(--bg)); box-shadow: inset 0 2px 10px rgba(0,0,0,.06); }
.ring.done::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; box-shadow: 0 0 28px 4px rgba(242, 182, 48, .45); pointer-events: none; }
.ring svg { position: relative; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .arc { transition: stroke-dasharray .4s ease; filter: drop-shadow(0 0 4px rgba(240, 120, 40, .35)); }
.ring .ticks line { stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
.ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring .num b { font-family: var(--font-num); font-weight: 400; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .num b.bump { animation: bump .35s ease-out; }
.ring .num small { font-size: 12px; color: var(--muted); font-weight: 700; }
.ring .num .lbl { letter-spacing: .08em; }
.remain { display: flex; align-items: baseline; gap: 6px; background: var(--fg); color: var(--bg); border-radius: 99px; padding: 6px 20px; font-weight: 900; }
.remain span { font-size: 15px; }
.remain b { font-family: var(--font-num); font-weight: 400; font-size: 32px; line-height: 1; color: #ffb347; }
.remain.done { background: linear-gradient(90deg, #f2b630, #e0782a); color: #fff; }
.remain.done b { color: #fff; }
.counter .verdict { text-align: center; }
.verdict { font-weight: 700; font-size: 14px; }
.verdict.good { color: var(--good); } .verdict.warn { color: var(--warn); } .verdict.bad { color: var(--bad); }

.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); }
.item .label { min-width: 0; font-weight: 700; font-size: 14px; }
.item .label small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper input { width: 64px; text-align: center; font-family: var(--font-num); font-size: 20px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 6px 2px; }
.stepper input:focus { border-color: var(--accent); }
.stepper input[type=number] { width: 64px; flex: none; }
button { white-space: nowrap; font-family: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 12px; color: var(--fg); background: var(--bg); padding: 8px 12px; font-size: 14px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mini { padding: 6px 9px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); }
.primary { background: var(--accent); color: #fff; padding: 12px 16px; font-size: 15px; border-radius: 14px; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

.task { border-radius: 16px; padding: 14px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 6px; }
.task .el { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.task p { margin: 0; font-weight: 700; font-size: 16px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { background: var(--bg); border: 1px solid var(--line); padding: 10px 4px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
textarea, input[type=text], input[type=email], input[type=number], select { width: 100%; font-family: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
textarea { min-height: 70px; resize: vertical; }
.rate { display: grid; grid-template-columns: 7.5em 1fr 1.5em; align-items: center; gap: 10px; font-size: 14px; }
.rate input { accent-color: var(--accent); width: 100%; }
.rate b { font-family: var(--font-num); font-weight: 400; font-size: 18px; text-align: right; }

.edit-row { display: grid; grid-template-columns: auto 1fr 56px auto; gap: 6px; align-items: center; }
.move { display: flex; flex-direction: column; gap: 2px; }
.move button { padding: 4px 10px; font-size: 12px; line-height: 1.2; min-width: 34px; }
.move button:disabled { opacity: .3; }
.sum { font-size: 13px; color: var(--muted); }
.sum b { font-family: var(--font-num); font-weight: 400; font-size: 17px; color: var(--fg); }
.sum.off b { color: var(--bad); }

.colors { display: flex; flex-wrap: wrap; gap: 10px; }
.colors button { width: 36px; height: 36px; border-radius: 50%; padding: 0; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

.staff { display: flex; flex-direction: column; gap: 8px; }
.staff-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: var(--bg); }
.staff-row svg { width: 44px; height: 44px; }
.staff-row .nm { min-width: 0; font-weight: 700; font-size: 14px; }
.staff-row .nm small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-row.ranked { grid-template-columns: 1.6em 44px 1fr auto; }
.pill { font-family: var(--font-num); font-size: 16px; padding: 2px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.pill.good { background: color-mix(in oklab, var(--good) 18%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in oklab, var(--bad) 18%, transparent); color: var(--bad); }

.log { display: flex; gap: 6px; flex-wrap: wrap; }
.log span { font-family: var(--font-num); font-size: 13px; padding: 2px 8px; border-radius: 8px; background: var(--bg); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); z-index: 10; }
nav.tabs .in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button { background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.banner { font-size: 13px; border-radius: 14px; padding: 10px 12px; background: var(--accent-soft); color: var(--fg); }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
details.staff-d { border-radius: 14px; background: var(--bg); }
details.staff-d > summary { list-style: none; cursor: pointer; }
details.staff-d > summary::-webkit-details-marker { display: none; }
details.staff-d .staff-row { background: transparent; }
.staff-detail { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.staff-detail .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.staff-detail .kv span:last-child { font-family: var(--font-num); white-space: nowrap; }
.assign { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.result-msg { font-weight: 700; text-align: center; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gcard { background: var(--nest); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.gcard svg { width: 110px; max-width: 100%; height: auto; }
.gcard b { font-size: 15px; font-weight: 900; overflow-wrap: anywhere; }
.gcard small { font-size: 12px; color: var(--muted); }
.gcard.me { outline: 3px solid var(--accent); }
.field-card { padding: 0; overflow: hidden; }
.field { position: relative; aspect-ratio: 400 / 320; }
.field .land { position: absolute; inset: 0; width: 100%; height: 100%; }
.roam { position: absolute; transform: translate(-50%, -85%); background: none; border: 0; padding: 0; width: var(--w); display: flex; flex-direction: column; align-items: center; animation: roambob 2.6s ease-in-out infinite; animation-delay: var(--delay); }
.roam svg { width: 100%; height: auto; filter: drop-shadow(0 2px 0 rgba(0,0,0,.08)); }
.roam .shadow { position: absolute; bottom: 14px; width: 70%; height: 8px; border-radius: 50%; background: rgba(0,0,0,.15); }
.roam .tag { font-size: 10px; font-weight: 700; background: rgba(255,255,255,.85); color: #333; border-radius: 99px; padding: 1px 7px; white-space: nowrap; margin-top: -4px; }
.roam.me .tag { background: var(--accent); color: #fff; }
@keyframes roambob { 0%,100% { transform: translate(-50%, -85%); } 50% { transform: translate(-50%, -92%); } }
@media (prefers-reduced-motion: reduce) { .roam { animation: none; } }
.field-head { padding: 12px 16px 16px; }
.count { font-size: 13px; color: var(--muted); font-weight: 400; }
.tally { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.ptlabel { display: flex; align-items: center; gap: 6px; font-size: 14px; flex: 1; }
.ptlabel input { width: 72px; flex: none; }
.gpt { font-family: var(--font-num); color: var(--accent); font-weight: 400; }
.hmonth { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.hm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.hm-head span { font-size: 12px; color: var(--muted); }
details.hday { background: var(--bg); border-radius: 12px; }
details.hday > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 14px; }
details.hday > summary::-webkit-details-marker { display: none; }
.hday-body { padding: 0 12px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.hday-body .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
/* today's score, big */
.score-hero { gap: 6px; background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 14%, var(--panel)), var(--panel)); }
.hero-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 700; }
.hero-num { display: flex; align-items: baseline; gap: 4px; justify-content: center; }
.hero-num b { font-family: var(--font-num); font-weight: 400; font-size: 72px; line-height: 1; color: var(--fg); }
.hero-num span { font-size: 18px; font-weight: 900; }
.hero-num b.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--accent); } 100% { transform: scale(1); } }
.hero-bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.hero-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffb347, var(--accent)); transition: width .35s ease; }
.hero-msg { text-align: center; font-weight: 900; font-size: 17px; margin: 2px 0 0; }
.hero-msg b { font-family: var(--font-num); font-weight: 400; font-size: 24px; color: var(--accent); }
.score-hero.done { background: linear-gradient(135deg, #fff3c4, var(--panel)); }
.score-hero.done .hero-bar i { background: linear-gradient(90deg, #ffd34d, #f2b630, #3fa36b); }
.score-hero.done .hero-msg { color: #b07a00; }
/* score bar above the tabs while on 今日 */
.livebar { max-width: 440px; margin: 0 auto 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.livebar[hidden] { display: none; }
.lb-num b { font-family: var(--font-num); font-weight: 400; font-size: 22px; }
.lb-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.lb-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.livebar.done .lb-bar i { background: #f2b630; }
.livebar.done .lb-msg { color: #b07a00; }
body.has-live .app { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
body.has-live .toast { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
/* 100-point celebration */
.celebrate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 16, 8, .45); animation: fadein .2s ease-out; }
.celebrate[hidden] { display: none; }
@keyframes fadein { from { opacity: 0; } }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; left: var(--x); color: var(--c); font-style: normal; font-size: calc(16px * var(--s)); line-height: 1; }
.confetti i.fall { top: -24px; animation: fall 2.6s cubic-bezier(.3,.6,.5,1) var(--d) forwards; }
.confetti i.float { bottom: -24px; animation: floatup 3s ease-out var(--d) forwards; }
@keyframes fall { to { transform: translateY(108vh) rotate(var(--r)); } }
@keyframes floatup { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-80vh) translateX(calc(var(--r) / 20)) scale(1.1); opacity: 0; } }
.cele-card { position: relative; overflow: hidden; background: var(--panel); border-radius: 28px; padding: 18px 26px 16px; text-align: center; width: min(320px, calc(100% - 48px)); animation: pop .45s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
.cele-glow { position: absolute; left: 50%; top: 90px; width: 200px; height: 200px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 80, .75), rgba(255, 214, 80, 0) 70%); animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .55; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }
.cele-dragon { position: relative; }
.cele-dragon svg { width: 150px; height: auto; }
.cele-dragon .dragon-body { animation: none; }
/* たまご: wobble, then a hop */
.st0 .cele-dragon { animation: wobble .5s ease-in-out 5, hop .5s ease-out 2.5s 2; transform-origin: 50% 90%; }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
.st0 .cele-glow { background: radial-gradient(circle, rgba(255, 245, 190, .95), rgba(255, 230, 120, 0) 70%); }
/* ヒナ: quick happy hops */
.st1 .cele-dragon { animation: chick .42s ease-in-out 8; transform-origin: 50% 100%; }
@keyframes chick { 0%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(0) scale(1.1, .88); } 55% { transform: translateY(-26px) scale(.95, 1.06); } }
.st1 .cele-glow { background: radial-gradient(circle, rgba(255, 170, 200, .7), rgba(255, 170, 200, 0) 70%); }
/* こども: big jumps with a twist */
.st2 .cele-dragon { animation: jump .7s ease-in-out 4; }
@keyframes jump { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-34px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg) scaleY(.92); } }
/* 成竜: rises, hovers, breathes fire, golden rays */
.st3 .cele-dragon { animation: soar 1.6s ease-in-out 3; }

  async function giveTask(sid, text, pt = 0) {
    const st = staffList.find(x => x.id === sid);
    const list = [...((st && st.givenTasks) || []).filter(g => !(st.givenDone || {})[g.id] || st.givenDone[g.id] === todayStr()), { id: nid(), text, pt, date: todayStr() }];
    try { await db.doc("staff/" + sid).update({ givenTasks: list }); return true; } catch (err) { return false; }
  }
  function openGiven(d) {
    const done = d.givenDone || {};
    return (d.givenTasks || []).filter(g => !done[g.id] || done[g.id] === todayStr());
  }

  function tasksCard() {
    const given = openGiven(S).map(g => `<label class="check ${S.givenDone && S.givenDone[g.id] ? "done" : ""}"><input type="checkbox" data-gdone="${esc(g.id)}" ${S.givenDone && S.givenDone[g.id] ? "checked" : ""}>
      <span><small>シンプーさんから${Number(g.pt) > 0 ? ` ・ できたら+${g.pt}点` : ""}</small>${esc(g.text)}</span><span>${Number(g.pt) > 0 ? `<b class="gpt">+${g.pt}</b>` : ""}</span></label>`).join("");
    const mine = (S.tasks || []).map(x => `<label class="check ${x.done ? "done" : ""}"><input type="checkbox" data-tdone="${x.id}" ${x.done ? "checked" : ""}>
      <span>${esc(x.text)}</span><button class="mini" data-tdel="${x.id}" aria-label="消す">×</button></label>`).join("");
    const n = (S.tasks || []).length + openGiven(S).length;
    const d = (S.tasks || []).filter(x => x.done).length + openGiven(S).filter(g => S.givenDone && S.givenDone[g.id]).length;
    return `<section class="card"><h2>今日のタスク ${n ? `<span class="month">${d} / ${n}</span>` : ""}</h2>
      ${n ? `<div class="checks">${given}${mine}</div>` : `<p class="sub">今日やることを書いておきましょう。終わったらチェックします。終わっていないタスクは次の日に持ちこします。</p>`}
      <div class="addline"><input type="text" id="new-task" placeholder="例：棚の商品を10点撮影" maxlength="60"><button class="mini" id="add-task">追加</button></div></section>`;
  }

  function goalsCard() {
    const m = monthStr();
    const gs = (S.goals || []).filter(g => g.month === m);
    const list = gs.map(g => `<label class="check ${g.done ? "done" : ""}"><input type="checkbox" data-goaldone="${g.id}" ${g.done ? "checked" : ""}>
      <span>${esc(g.text)}</span><button class="mini" data-goaldel="${g.id}" aria-label="消す">×</button></label>`).join("");
    return `<section class="card"><h2>今月の目標 <span class="month">${Number(m.slice(5))}月</span></h2>
      ${gs.length ? `<div class="checks">${list}</div>` : `<p class="sub">今月どうなりたいかを1〜3個決めましょう。例：「ドラゴンをこどもまで育てる」「表現力を4にする」</p>`}
      ${gs.length < 3 ? `<div class="addline"><input type="text" id="new-goal" placeholder="今月の目標を書く" maxlength="60"><button class="mini" id="add-goal">追加</button></div>` : ""}</section>`;
  }

    const task = S.today.checkedIn && tk

      <div class="seg" role="group" aria-label="できたかどうか">${Object.entries(RES).map(([k, l]) => `<button data-res="${k}" aria-pressed="${r.result === k}">${l}</button>`).join("")}</div>

  // field spots (x%, y%) from back to front
  const SPOTS = [[14,66],[40,63],[64,66],[88,64],[26,78],[54,77],[78,80],[10,90],[40,92],[66,93],[90,92],[24,66]];

          <g fill="#fff" opacity=".9"><ellipse cx="80" cy="40" rx="26" ry="9"/><ellipse cx="96" cy="34" rx="16" ry="9"/><ellipse cx="250" cy="28" rx="20" ry="7"/></g>
          <g fill="#ffd34d"><circle cx="120" cy="250" r="3"/><circle cx="240" cy="290" r="3"/><circle cx="60" cy="270" r="2.5"/><circle cx="350" cy="280" r="2.5"/></g>
        </svg>${field}</div>
        <div class="field-head"><h2>ドラゴンの原っぱ</h2><p class="sub">みんなのドラゴンが暮らしています。タップすると誰のドラゴンかわかります。</p></div></section>
      <section class="card"><h2>ドラゴン図鑑 <small class="count">${list.length}ひき</small></h2>

  function viewAdmin() {
    if (!staffLoaded) return `<div class="loading">スタッフのデータを読みこみ中…</div>`;
    const t = todayStr();
    const list = staffList.map(d => {
      const isToday = d.today && d.today.date === t;
      const sc = isToday ? dayScore(d) : null;
      const tk = d.assigned && d.assigned.date === t && d.assigned.text ? d.assigned.text : (isToday && d.today.task ? d.today.task.text : "");
      const res = isToday && d.today.reflect && d.today.reflect.result ? RES[d.today.reflect.result] : "まだ";
      const status = !isToday || !d.today.checkedIn ? "未出勤" : `課題${res}`;
      const items = (d.items || []).map(it => `<div class="kv"><span>${esc(it.name)}（${it.pt}点）</span><span>${isToday ? it.val : 0}回 = ${isToday ? r1(it.pt * it.val) : 0}点</span></div>`).join("");
      const hist = historyBlock(records(d).filter(h => !h.live), d.id);
      const rt = d.ratings || {};
      return `<details class="staff-d"${histOpen.has(d.id) ? " open" : ""}><summary><div class="staff-row">${dragonSVG(d.stage || 0, d.color || COLORS[0], "mini-d", d.streak || 0)}
        <div class="nm"><span class="dot" style="background:${esc(d.color)};width:10px;height:10px;margin-right:6px;border:none;box-shadow:none"></span>${esc(d.name)}<small>${esc(d.job)} ・ ${STAGES[d.stage || 0]} ・ ${status}</small></div>
        <span class="pill ${sc === null ? "warn" : tone(sc)}">${sc === null ? "−" : sc}</span></div></summary>
        <div class="staff-detail">
          ${tk ? `<div><b>今日の課題：</b>${esc(tk)}</div>` : ""}
          ${isToday && d.today.reflect && d.today.reflect.note ? `<div><b>ひとこと：</b>${esc(d.today.reflect.note)}</div>` : ""}
          <div><b>点数項目</b></div>${items}
          <div><b>自己評価：</b>素直さ ${rt.sunao || "-"} ・ 興味 ${rt.kyomi || "-"} ・ 表現力 ${rt.hyogen || "-"}</div>
          ${hist ? `<div><b>これまでの点数</b></div>${hist}` : ""}
          ${(d.goals || []).filter(g => g.month === monthStr()).length ? `<div><b>今月の目標</b></div>${d.goals.filter(g => g.month === monthStr()).map(g => `<div class="kv"><span>${esc(g.text)}</span><span>${g.done ? "達成" : "−"}</span></div>`).join("")}` : ""}
          ${(d.tasks || []).length || openGiven(d).length ? `<div><b>今日のタスク</b></div>${openGiven(d).map(g => `<div class="kv"><span>${esc(g.text)}（渡したタスク${Number(g.pt) > 0 ? "・" + g.pt + "点" : ""}）</span><span>${d.givenDone && d.givenDone[g.id] ? "完了" : "−"} <button class="mini" data-gdel="${esc(d.id)}|${esc(g.id)}" aria-label="取り消す">×</button></span></div>`).join("")}${(d.tasks || []).map(x => `<div class="kv"><span>${esc(x.text)}</span><span>${x.done ? "完了" : "−"}</span></div>`).join("")}` : ""}
          <div class="assign"><input type="text" id="gv-${esc(d.id)}" placeholder="タスクを渡す" maxlength="60" aria-label="${esc(d.name)}さんに渡すタスク"><button class="mini" data-give="${esc(d.id)}">渡す</button></div>
          <div class="assign"><input type="text" id="as-${esc(d.id)}" placeholder="今日の課題を指定する" value="${d.assigned && d.assigned.date === t ? esc(d.assigned.text) : ""}" aria-label="${esc(d.name)}さんへの課題"><button class="mini" data-assign="${esc(d.id)}">指定</button></div>
        </div></details>`;
    }).join("");
    const todays = staffList.filter(d => d.today && d.today.date === t && (d.today.checkedIn || dayScore(d) > 0));
    const avg = todays.length ? Math.round(todays.reduce((a, d) => a + dayScore(d), 0) / todays.length) : 0;
    const hit = todays.filter(d => dayScore(d) >= 100).length;
    const memberCard = `<section class="card"><h2>メンバー</h2><p class="sub">スキるを使えるのは、ここに登録したGmailアドレスの人だけです。</p>
      <div class="checks">${members.map(m => `<div class="check"><span></span><span>${esc(m)}</span><button class="mini" data-mdel="${esc(m)}" aria-label="${esc(m)}を外す">外す</button></div>`).join("") || `<p class="sub">まだ誰も登録していません。</p>`}</div>
      <div class="addline"><input type="email" id="new-member" placeholder="例：staff@gmail.com" autocomplete="off"><button class="mini" id="add-member">追加</button></div></section>`;
    const recs = staffList.map(d => ({ d, r: records(d) }));
    const dates = [...new Set(recs.flatMap(x => x.r.map(h => h.date)))].sort().reverse();
    const pastDates = dates.filter(x => x < t);
    const sel = annDate && dates.includes(annDate) ? annDate : (pastDates[0] || dates[0] || null);
    let annCard = "";
    if (sel) {
      const rows = recs.map(({ d, r }) => ({ d, h: r.find(h => h.date === sel) })).filter(x => x.h).sort((a, b) => b.h.s - a.h.s);
      let rank = 0, prev = null;
      const lines = rows.map(({ d, h }, i) => { if (h.s !== prev) { rank = i + 1; prev = h.s; }
        const its = (h.items || []).map(rowOf).map(([n, pt, v]) => `<div class="kv"><span>${esc(n)}（${pt}点）</span><span>${v}回 = ${r1(pt * v)}点</span></div>`).join("") || `<p class="sub">内訳の記録はありません。</p>`;
        return `<details class="staff-d"><summary><div class="staff-row ranked"><span class="rank">${rank}</span>${dragonSVG(d.stage || 0, d.color || COLORS[0], "mini-d")}
          <div class="nm">${esc(d.name)}<small>${esc(d.job)}${h.res ? " ・ 課題" + RES[h.res] : ""}</small></div><span class="pill ${tone(h.s)}">${h.s}</span></div></summary>
          <div class="staff-detail">${its}</div></details>`; }).join("");
      const hit = rows.filter(x => x.h.s >= 100).length;
      const avgA = rows.length ? Math.round(rows.reduce((a, x) => a + x.h.s, 0) / rows.length) : 0;
      annCard = `<section class="card"><h2>点数発表</h2><p class="sub">朝の発表用です。日付を選ぶと、その日の点数が高い順に並びます。名前をタップすると内訳が見られます。</p>
        <select id="ann-date" aria-label="発表する日">${dates.map(x => `<option value="${x}"${x === sel ? " selected" : ""}>${fullDate(x)}${x === t ? "・今日（途中）" : ""}</option>`).join("")}</select>
        <div class="ann-sum"><span>${rows.length}人</span><span>平均 <b>${avgA}</b>点</span><span>100点 <b>${hit}</b>人</span></div>
        <div class="staff">${lines}</div></section>`;
    }
    const openAll = staffList.flatMap(d => openGiven(d).map(g => ({ d, g })));
    const giveCard = staffList.length ? `<section class="card"><h2>タスクを渡す</h2><p class="sub">スタッフを選んでタスクと点数を書くと、その人の「きょう」の画面に「シンプーさんから」と出ます。できたらチェックした日の点数に足されます。終わるまで毎日残ります。点数なしなら0にしてください。</p>
      <select id="give-to" aria-label="渡す相手"><option value="">誰に渡しますか？</option><option value="*">全員</option>${staffList.map(d => `<option value="${esc(d.id)}">${esc(d.name)}（${esc(d.job)}）</option>`).join("")}</select>
      <input type="text" id="give-text" placeholder="例：棚の商品を10点撮影" maxlength="60" aria-label="渡すタスク">
      <div class="addline"><label class="ptlabel">できたら <input type="number" id="give-pt" inputmode="numeric" min="0" max="100" value="10" aria-label="できたらもらえる点数"> 点</label><button class="mini" id="give-go">渡す</button></div>
      ${openAll.length ? `<div><b>渡したタスク</b></div>${openAll.map(({ d, g }) => `<div class="given-row"><span><b>${esc(d.name)}</b>　${esc(g.text)}${Number(g.pt) > 0 ? `（${g.pt}点）` : ""}</span><span class="st ${d.givenDone && d.givenDone[g.id] ? "ok" : ""}">${d.givenDone && d.givenDone[g.id] ? "完了" : "まだ"}</span><button class="mini" data-gdel="${esc(d.id)}|${esc(g.id)}" aria-label="取り消す">×</button></span></div>`).join("")}` : ""}</section>` : "";
    return memberCard + giveCard + annCard + `<section class="card"><h2>みんなの今日</h2>
      ${staffList.length ? `<div class="row"><div class="item" style="display:block"><small style="color:var(--muted)">出勤</small><div style="font-family:var(--font-num);font-size:24px">${todays.length} / ${staffList.length}人</div></div>
      <div class="item" style="display:block"><small style="color:var(--muted)">平均</small><div style="font-family:var(--font-num);font-size:24px">${avg}点</div></div>
      <div class="item" style="display:block"><small style="color:var(--muted)">100点</small><div style="font-family:var(--font-num);font-size:24px">${hit}人</div></div></div>
      <p class="sub">名前をタップすると、点数の内訳、ふりかえり、課題の指定が出ます。</p>
      <div class="staff">${list}</div>`
      : `<p class="sub">まだ誰も登録していません。上の「メンバー」にスタッフのGmailを追加して、アプリのアドレスを伝えてください。</p>`}</section>`;
  }

  function render() {
    if (!booted) { $("#app").innerHTML = header() + '<div class="loading">読みこみ中…</div>'; return; }
    let html = header();
    if (needLogin || notMember) {
      $("#app").innerHTML = html + (needLogin ? viewLogin() : viewNotMember());
      $("#tabs").innerHTML = ""; $("#tabs").parentElement.hidden = true;
      return;
    }
    $("#tabs").parentElement.hidden = false;
    if (!S && !isOwner) html += viewSetup();
    else if (tab === "admin") html += viewAdmin();
    else if (tab === "all") html += viewAll();
    else if (!S) html += viewSetup();
    else html += ({ today: viewToday, items: viewItems, reflect: viewReflect }[tab] || viewToday)();
    $("#app").innerHTML = html;
    const tabs = [
      ["today", "きょう", '<path d="M12 3c-4 3-7 6-7 10a7 7 0 0 0 14 0c0-4-3-7-7-10z" fill="none" stroke="currentColor" stroke-width="2"/>'],
      ["items", "点数項目", '<path d="M5 6h14M5 12h14M5 18h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
      ["reflect", "ふりかえり", '<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'],
      ["all", "みんな", '<circle cx="7" cy="14" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="14" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4l1.5 3 3 .5-2.2 2 .6 3-2.9-1.5-2.9 1.5.6-3-2.2-2 3-.5z" fill="currentColor"/>']
    ];
    if (!S) tabs.splice(0, 3, ["today", "登録", tabs[0][2]]);
    if (isOwner) tabs.push(["admin", "管理者", '<circle cx="9" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5M16 6.5a3 3 0 0 1 0 6M18 14.5c2 .6 3 2.5 3 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>']);
    $("#tabs").style.gridTemplateColumns = `repeat(${tabs.length}, 1fr)`;
    $("#tabs").innerHTML = tabs.map(([k, l, ic]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join("");
    growFx = false;
    liveBar();
  }

  function pickTask() {
    const weakest = Object.keys(ELS).sort((a, b) => S.ratings[a] - S.ratings[b])[0];
    const el = Math.random() < 0.6 ? weakest : Object.keys(ELS)[Math.floor(Math.random() * 3)];
    const pool = [...COMMON_TASKS[el], ...((TASKS[S.job] || {})[el] || [])];
    const list = pool.filter(t => t !== S.lastTask);
    return { el, text: list[Math.floor(Math.random() * list.length)] };
  }

  function liveTotals(it) {
    $("#cnt-" + it.id).textContent = it.val;
    $("#sub-" + it.id).textContent = r1(it.pt * it.val) + "点";
    updateScore();
  }

  document.getElementById("celebrate").addEventListener("click", () => { clearTimeout(celebrate.t); closeCelebrate(); });
  document.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); return; }
    if (d.histopen) { histOpen.add(d.histopen); render(); return; }
    if (d.histclose) { histOpen.delete(d.histclose); render(); return; }
    if (d.peek) { const g = dragons.find(x => x.id === d.peek); if (g) toast(`${g.id === uid ? "あなた" : (g.name || "だれか") + "さん"}のドラゴン「${g.dragonName || STAGES[g.stage || 0]}」・${STAGES[g.stage || 0]}`); return; }
    if (b.id === "login") { login(); return; }
    if (b.id === "logout" || b.id === "logout2") { await flush(); await firebase.auth().signOut(); location.reload(); return; }
    if (b.id === "add-member") {
      const inp = $("#new-member"); const em = inp.value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { inp.focus(); toast("Gmailアドレスを入れてください"); return; }
      try { await db.doc("members/" + em).set({ addedAt: new Date().toISOString() }); inp.value = ""; toast("メンバーに追加しました"); } catch (err) { toast("追加できませんでした"); }
      return;
    }
    if (d.mdel) {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "本当に外す"; setTimeout(() => { b.dataset.confirm = ""; b.textContent = "外す"; }, 3000); return; }
      try { await db.doc("members/" + d.mdel).delete(); toast("外しました"); } catch (err) { toast("外せませんでした"); }
      return;
    }
    if (d.sucolor) { document.querySelectorAll("[data-sucolor]").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
    if (b.id === "su-go") {
      const name = $("#su-name").value.trim();
      if (!name) { $("#su-name").focus(); toast("名前を入れてください"); return; }
      const color = ($("[data-sucolor][aria-pressed=true]") || {}).dataset?.sucolor || COLORS[0];
      S = newStaff(name, $("#su-job").value, color, $("#su-dragon").value.trim().slice(0, 12));
      tab = "today"; render(); persist(); toast("たまごを受け取りました"); return;
    }
    if (d.assign) {
      const text = $("#as-" + d.assign).value.trim();
      try { await db.doc("staff/" + d.assign).update({ assigned: { date: todayStr(), text } }); toast(text ? "課題を指定しました" : "指定を外しました"); }
      catch (err) { toast("指定できませんでした"); }
      return;
    }
    if (b.id === "give-go") {
      const to = $("#give-to").value, inp = $("#give-text"), text = inp.value.trim(), pt = Math.max(0, Math.min(100, Math.round(Number($("#give-pt").value) || 0)));
      if (!to) { $("#give-to").focus(); toast("渡す相手を選んでください"); return; }
      if (!text) { inp.focus(); return; }
      const ids = to === "*" ? staffList.map(x => x.id) : [to];
      let ok = 0; for (const sid of ids) { if (await giveTask(sid, text, pt)) ok++; }
      if (ok) { inp.value = ""; toast(ids.length > 1 ? `${ok}人にタスクを渡しました` : "タスクを渡しました"); } else toast("渡せませんでした");
      return;
    }
    if (d.give) {
      const inp = $("#gv-" + d.give); const text = inp.value.trim(); if (!text) { inp.focus(); return; }
      if (await giveTask(d.give, text)) { inp.value = ""; toast("タスクを渡しました"); } else toast("渡せませんでした");
      return;
    }
    if (d.gdel) {
      const [sid, gid] = d.gdel.split("|"); const st = staffList.find(x => x.id === sid);
      try { await db.doc("staff/" + sid).update({ givenTasks: ((st && st.givenTasks) || []).filter(g => g.id !== gid) }); toast("取り消しました"); } catch (err) { toast("取り消せませんでした"); }
      return;
    }
    if (!S) return;
    if (b.id === "add-task") { const v = $("#new-task").value.trim(); if (!v) return; S.tasks = [...(S.tasks || []), { id: nid(), text: v, done: false }]; render(); persist(); $("#new-task").focus(); return; }
    if (d.tdel) { S.tasks = S.tasks.filter(x => x.id !== d.tdel); render(); persist(); return; }
    if (b.id === "add-goal") { const v = $("#new-goal").value.trim(); if (!v) return; S.goals = [...(S.goals || []), { id: nid(), text: v, month: monthStr(), done: false }]; render(); persist(); return; }
    if (d.goaldel) { S.goals = S.goals.filter(x => x.id !== d.goaldel); render(); persist(); return; }
    if (b.id === "checkin") { S.today.checkedIn = true; S.today.task = pickTask(); render(); persist(); toast("今日の課題が出ました"); return; }
    if (d.dec) { const it = S.items.find(x => x.id == d.dec); it.val = Math.max(0, r1((Number(it.val) || 0) - 1)); $("#val-" + it.id).value = it.val; liveTotals(it); persist(); return; }
    if (d.inc) { const it = S.items.find(x => x.id == d.inc); it.val = r1((Number(it.val) || 0) + 1); $("#val-" + it.id).value = it.val; liveTotals(it); persist(); return; }
    if (d.up || d.down) {
      const i = S.items.findIndex(x => x.id == (d.up || d.down)), j = d.up ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= S.items.length) return;
      const a = [...S.items]; [a[i], a[j]] = [a[j], a[i]]; S.items = a; render(); persist();
      const again = document.querySelector(`[data-${d.up ? "up" : "down"}="${a[j].id}"]`); if (again && !again.disabled) again.focus();
      return;
    }
    if (d.del) { S.items = S.items.filter(x => x.id != d.del); render(); persist(); return; }
    if (b.id === "additem") { const id = Math.max(Date.now(), ...S.items.map(x => x.id + 1)); S.items.push({ id, name: "新しい項目", pt: 5, val: 0 }); render(); persist(); $("#name-" + id).focus(); return; }
    if (d.color) { S.color = d.color; render(); persist(); toast("ドラゴンの色を変えました"); return; }
    if (d.res) { S.today.reflect.result = d.res; render(); persist(); return; }
  });

  document.addEventListener("change", e => {
    if (e.target.id === "ann-date") { annDate = e.target.value; render(); return; }
    if (!S) return;
    const t = e.target, d = t.dataset;
    if (d.tdone) { const x = S.tasks.find(y => y.id === d.tdone); x.done = t.checked; render(); persist(); if (t.checked) toast("おつかれさま！"); return; }
    if (d.gdone) { S.givenDone = { ...(S.givenDone || {}) }; if (t.checked) S.givenDone[d.gdone] = todayStr(); else delete S.givenDone[d.gdone]; render(); persist(); updateScore(false); if (t.checked) toast("おつかれさま！"); return; }
    if (d.goaldone) { const g = S.goals.find(y => y.id === d.goaldone); g.done = t.checked; render(); persist(); if (t.checked) toast("目標達成！"); return; }
    if (d.name) { S.items.find(x => x.id == d.name).name = t.value.trim() || "項目"; render(); persist(); }
    else if (d.ptin) { const it = S.items.find(x => x.id == d.ptin); it.pt = Math.max(1, Math.min(100, Number(t.value) || 1)); render(); persist(); }
    else if (t.id === "set-name") { S.name = t.value.trim() || S.name; render(); persist(); }
    else if (t.id === "set-job") { S.job = t.value; render(); persist(); }
    else if (t.id === "set-dragon") { S.dragonName = t.value.trim().slice(0, 12); render(); persist(); toast("ドラゴンの名前を変えました"); }
  });
  document.addEventListener("input", e => {
    if (!S) return;
    const t = e.target;
    if (t.dataset.val) { const it = S.items.find(x => x.id == t.dataset.val); it.val = Math.max(0, Math.round((Number(t.value) || 0) * 100) / 100); liveTotals(it); persist(); }
    else if (t.dataset.rate) { S.ratings[t.dataset.rate] = Number(t.value); t.nextElementSibling.textContent = t.value; persist(); }
    else if (t.id === "note") { S.today.reflect.note = t.value; persist(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.isComposing) return;
    const map = { "new-task": "#add-task", "new-goal": "#add-goal", "new-member": "#add-member" };
    if (map[e.target.id]) { e.preventDefault(); $(map[e.target.id]).click(); }
    else if (e.target.id && e.target.id.startsWith("gv-")) { e.preventDefault(); $(`[data-give="${e.target.id.slice(3)}"]`).click(); }
  });
  document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.val) e.target.select(); });
  // coming back to the app: first pull the latest save (another phone/PC may have changed it), then close yesterday
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "hidden") {
      const a = document.activeElement; if (a && a.tagName === "INPUT") a.blur();   // finishes a half-typed name
      if (dirty) { clearTimeout(saveTimer); flush(); }
      return;
    }
    if (document.visibilityState !== "visible" || !S) return;
    if (db && uid && !dirty && !writing) {
      try {
        const snap = await db.doc("staff/" + uid).get({ source: "server" });
        if (snap.exists && !dirty && !writing) { const d = snap.data(); if ((d.rev || 0) !== ((base && base.rev) || 0) || (d.updatedAt || "") !== ((base && base.updatedAt) || "")) { adopt(d); render(); } }
      } catch (e) {}
    }
    if (rollover()) { render(); persist(); if (S.lastResult) toast(S.lastResult.msg); }
  });

  // ---- boot ----
  function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    firebase.auth().signInWithPopup(provider).catch(err => {
      if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) firebase.auth().signInWithRedirect(provider);
      else if (err && err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") { banner = "ログインできませんでした（" + (err.code || err.message || "不明") + "）。この画面をClaudeに送ってください。"; render(); }
    });
  }

  function boot() {
    if (!window.SKIRU_CONFIG || !window.firebase) { banner = "設定ファイルが読みこめませんでした。"; booted = true; needLogin = true; render(); return; }
    firebase.initializeApp(SKIRU_CONFIG.firebaseConfig);
    db = firebase.firestore();
    firebase.auth().getRedirectResult().catch(err => { banner = "ログインできませんでした（" + ((err && (err.code || err.message)) || "不明") + "）。この画面をClaudeに送ってください。"; render(); });
    let started = false;
    firebase.auth().onAuthStateChanged(async u => {
      if (!u) { authUser = null; needLogin = true; booted = true; render(); return; }
      if (started) return;
      started = true; authUser = u; needLogin = false; uid = u.uid;
      const email = (u.email || "").toLowerCase();
      isOwner = (SKIRU_CONFIG.adminEmails || []).map(x => x.toLowerCase()).includes(email);
      if (!isOwner) {
        try { const m = await db.doc("members/" + email).get(); if (!m.exists) { notMember = true; booted = true; render(); return; } }
        catch (e) { notMember = true; booted = true; render(); return; }
      }
      start();
    });
  }

  function start() {
      let timer = setTimeout(() => { banner = "データにまだつながりません。通信を確認してください。"; render(); }, 10000);
      let first = true;
      db.doc("staff/" + uid).onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(timer); if (banner.startsWith("データにまだ")) banner = ""; }
        if (first) {
          if (!snap.exists && snap.metadata.fromCache) return;
          first = false; booted = true;
          if (snap.exists) { adopt(snap.data()); created = true; }
          if (isOwner && !S) tab = "admin";
          if (S && rollover()) { persist(); if (S.lastResult) setTimeout(() => toast(S.lastResult.msg), 300); }
          render();
          return;
        }
        // a newer save from another phone/PC: take it, unless this screen has unsaved edits
        if (snap.exists && S && !snap.metadata.hasPendingWrites && !dirty && !writing) {
          const d = snap.data();
          if ((d.rev || 0) !== ((base && base.rev) || 0) || (d.updatedAt || "") !== ((base && base.updatedAt) || "")) {
            adopt(d);
            if (rollover()) persist();
            const f = document.activeElement && document.activeElement.id;
            if (tab !== "admin" && !(f && (f === "new-task" || f === "new-goal" || f === "note" || f.startsWith("val-") || f.startsWith("name-") || f.startsWith("pt-")))) render();
            return;
          }
        }
        // later snapshots: take the owner's assignment, keep local edits
        if (snap.exists && S) {
          const a = snap.data().assigned, gt = snap.data().givenTasks;
          if (JSON.stringify(a) !== JSON.stringify(S.assigned) || JSON.stringify(gt) !== JSON.stringify(S.givenTasks)) {
            S.assigned = a ? structuredClone(a) : undefined; S.givenTasks = gt ? structuredClone(gt) : [];
            const f = document.activeElement && document.activeElement.id;
            if (tab !== "admin" && f !== "new-task" && f !== "new-goal" && f !== "note") render();
          }
        }
      }, err => { clearTimeout(timer); banner = "データを読みこめませんでした。ページを開き直してください。"; render(); });
      db.collection("dragons").onSnapshot(qs => {
        dragons = qs.docs.filter(x => x.exists).map(x => ({ id: x.id, ...x.data() }));
        dragonsLoaded = true;
        if (tab === "all") render();
      }, () => { dragonsLoaded = true; if (tab === "all") render(); });
      if (isOwner) {
        db.collection("staff").onSnapshot(qs => {
          staffList = qs.docs.filter(x => x.exists).map(x => ({ id: x.id, ...x.data() }));
          staffList.sort((a, b) => String(a.name).localeCompare(String(b.name), "ja"));
          staffLoaded = true;
          if (tab === "admin") {
            const open = [...document.querySelectorAll("details.staff-d")].map((x, i) => x.open ? i : -1).filter(i => i >= 0);
            const focused = document.activeElement && document.activeElement.id;
            if (focused && (focused.startsWith("as-") || focused.startsWith("gv-"))) return;
            render();
            const ds = document.querySelectorAll("details.staff-d"); open.forEach(i => ds[i] && (ds[i].open = true));
          }
        }, () => { staffLoaded = true; });
      }
      if (isOwner) {
        db.collection("members").onSnapshot(qs => {
          members = qs.docs.map(x => x.id).sort();
          membersLoaded = true;
          const f = document.activeElement && document.activeElement.id;
          if (tab === "admin" && f !== "new-member") render();
        }, () => {});
      }
  }
  render();
  boot();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
